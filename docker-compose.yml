version: '3.8'

services:
  soketi:
    image: quay.io/soketi/soketi:latest
    restart: always
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_DEFAULT_APP_ID: "test-app"
      SOKETI_DEFAULT_APP_KEY: "test-key"
      SOKETI_DEFAULT_APP_SECRET: "test-secret"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "1"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_CHANNELS: "1"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_STATS: "1"
      SOKETI_METRICS_ENABLED: "0"
    ports:
      - "6001:6001"
      - "9601:9601"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  # Started by the TLS test suite, which generates the mounted certificates.
  otel-collector-tls:
    image: otel/opentelemetry-collector-contrib:latest
    profiles:
      - tls
    restart: always
    command: ["--config=/etc/otel-config-tls.yaml"]
    volumes:
      - ./otel-config-tls.yaml:/etc/otel-config-tls.yaml
      - ./tests/testdata/otel-tls:/etc/otel-tls:ro
    ports:
      - "4319:4319"

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    restart: always
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml